<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b0a18">
<meta name="robots" content="noindex,nofollow,noarchive"><!-- 공개 주소여도 검색엔진엔 안 잡히게 (2026-09-21) -->
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="천억">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" sizes="180x180" href="icon-180.png">
<title>천억 캘린더</title>
<style>
  :root{--bg:#0b0a18;--card:#15142a;--line:#2a2947;--txt:#dce0f5;--dim:#8487bd;--dim2:#6b6e9c;
        --ok:#8fd6a8;--warn:#ffc454;--bad:#ff9aaa;--hi:#ffcf8a;--blue:#7ea6ff;}
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;padding:0;background:var(--bg);color:var(--txt);
       font-family:-apple-system,BlinkMacSystemFont,'Noto Sans KR','Malgun Gothic',sans-serif;
       font-size:15px;line-height:1.5;overflow-x:hidden}
  body{padding:env(safe-area-inset-top) 0 calc(env(safe-area-inset-bottom) + 12px)}
  .wrap{max-width:720px;margin:0 auto;padding:0 12px}
  header{position:sticky;top:0;z-index:20;background:linear-gradient(180deg,#0b0a18 88%,rgba(11,10,24,0));padding:10px 0 8px}
  h1{font-size:17px;margin:0 0 4px;font-weight:800;letter-spacing:-.3px}
  .stamp{font-size:11.5px;color:var(--dim)}
  .stamp b{color:var(--warn)}
  .warn{margin:8px 0 0;padding:7px 10px;border-radius:9px;background:rgba(255,154,170,.09);
        border:1px solid rgba(255,154,170,.32);color:#ffc7cf;font-size:11.5px;line-height:1.5}
  .row{display:flex;gap:6px;overflow-x:auto;padding:8px 0 4px;scrollbar-width:none}
  .row::-webkit-scrollbar{display:none}
  .chip{flex:0 0 auto;padding:7px 13px;border-radius:18px;border:1px solid var(--line);
        background:#141327;color:var(--dim);font-size:13px;white-space:nowrap;cursor:pointer}
  .chip.on{background:#23325c;border-color:#4f8ef7;color:#cfe0ff;font-weight:700}
  .chip .n{font-size:11px;color:var(--hi);margin-left:4px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:12px;margin:10px 0;overflow:hidden}
  .chead{padding:10px 12px;border-bottom:1px solid var(--line)}
  .chead .t{font-size:15px;font-weight:800}
  .chead .d{font-size:11.5px;color:var(--dim);margin-top:3px}
  .grp{padding:6px 12px 2px;font-size:11.5px;color:var(--blue);font-weight:700;border-top:1px dashed var(--line)}
  .it{display:flex;align-items:flex-start;gap:8px;padding:11px 12px;border-top:1px solid rgba(42,41,71,.55);
      color:inherit;text-decoration:none;cursor:pointer}
  a.it:active,.it:active{background:#23325c}
  /* 📐 절대값 차트 시트 = 종목 줄을 누르면 아래에서 올라온다 (2026-09-21) */
  .absm{position:fixed;inset:0;z-index:50;background:rgba(0,0,0,.62);display:flex;align-items:flex-end;justify-content:center}
  .absm[hidden]{display:none}
  .abs-sheet{width:100%;max-width:720px;max-height:92vh;overflow-y:auto;background:#0d0c1c;border:1px solid var(--line);
             border-radius:16px 16px 0 0;padding:12px 12px calc(env(safe-area-inset-bottom) + 14px)}
  .abs-head{display:flex;align-items:center;gap:8px;margin-bottom:8px}
  .abs-head b{font-size:16px}
  .abs-head .cd{font-size:11.5px;color:var(--dim2)}
  .abs-x{margin-left:auto;font-size:22px;color:var(--dim);padding:0 6px;cursor:pointer;line-height:1}
  .abs-r{display:inline-block;padding:3px 10px;border-radius:12px;font-size:11px;border:1px solid rgba(255,255,255,.12);
         background:rgba(255,255,255,.04);color:var(--dim);cursor:pointer;margin-left:4px}
  .abs-r.on{border-color:rgba(94,255,214,.45);background:rgba(94,255,214,.16);color:#5effd6}
  .abs-chip{background:rgba(255,255,255,.04);border-radius:7px;padding:5px 8px;flex:1;min-width:88px}
  .abs-chip .l{font-size:9.5px;color:#6b7482}
  .abs-chip .v{font-size:13px;font-weight:700;font-variant-numeric:tabular-nums}
  .abs-chip .v i{font-style:normal;font-size:10px;color:#8487bd;font-weight:400}
  .abs-nv{display:block;margin-top:10px;text-align:center;padding:10px;border-radius:10px;font-weight:700;
          background:rgba(3,199,90,.14);border:1px solid rgba(3,199,90,.5);color:#03c75a;text-decoration:none}
  .abs-note{margin-top:7px;font-size:10px;color:#6b7482;line-height:1.5}
  .it .nm{flex:1;min-width:0}
  .go{flex:0 0 auto;align-self:center;font-size:11px;color:#03c75a;border:1px solid rgba(3,199,90,.45);
      border-radius:5px;padding:2px 6px;white-space:nowrap;font-weight:700}
  .it .nm b{font-size:14.5px;font-weight:700}
  .it .sub{font-size:11.5px;color:var(--dim);margin-top:2px;word-break:break-all}
  .it .mat{font-size:11.5px;color:#9fc8ff;margin-top:3px;word-break:break-all}
  /* 📐 절대값 한 줄 = 뼈대·바로 아래 선·바로 위 선 */
  .it .abs{font-size:11px;color:#9aa0c8;margin-top:3px;font-variant-numeric:tabular-nums;word-break:keep-all}
  .it .abs b{font-weight:700}
  .it .abs i{font-style:normal;color:var(--dim2)}
  .lab{flex:0 0 auto;font-size:10px;font-weight:700;border:1px solid;border-radius:4px;padding:1px 4px;margin-top:2px}
  .empty{padding:16px 12px;color:var(--dim2);font-size:13px}
  .foot{margin:16px 0 4px;color:var(--dim2);font-size:11px;line-height:1.7}
  .lkbox{margin:0 0 12px;padding:10px 12px;border-radius:10px;background:var(--card);border:1px solid var(--line);font-size:12px}
  .lkrow{display:flex;gap:6px;margin-top:7px;flex-wrap:wrap}
  .lk{padding:7px 12px;border-radius:16px;border:1px solid var(--line);background:#141327;color:var(--dim);font-size:12.5px;cursor:pointer}
  .lk.on{background:rgba(3,199,90,.14);border-color:rgba(3,199,90,.5);color:#03c75a;font-weight:700}
  .cnt{font-size:11.5px;color:var(--dim);padding:2px 12px 8px}
  a{color:var(--blue)}
  /* 홈 화면 아이콘 안내 — 아이콘으로 열면 자동으로 안 뜬다 */
  .tip{margin:10px 0 0;padding:11px 12px;border-radius:11px;background:rgba(255,207,138,.09);
       border:1px solid rgba(255,207,138,.36);font-size:12.5px;line-height:1.65;color:#e8dcc4}
  .tip .th{font-weight:800;color:var(--hi);font-size:13.5px;margin-bottom:5px}
  .tip b{color:#fff}
  .tip ol{margin:6px 0 0;padding-left:18px}
  .tip li{margin:3px 0}
  .tiprow{display:flex;gap:6px;margin-top:9px;flex-wrap:wrap}
  .tiprow a,.tiprow span{padding:7px 12px;border-radius:16px;border:1px solid var(--line);
       background:#141327;color:var(--dim);font-size:12.5px;cursor:pointer;text-decoration:none}
  .tiprow a{background:rgba(255,207,138,.16);border-color:rgba(255,207,138,.5);color:var(--hi);font-weight:700}
  .tipagain{color:var(--dim);text-decoration:underline;cursor:pointer}
  /* 카카오톡 등 '앱 안의 브라우저' 경고 = 여기선 홈 화면 추가가 아예 없다 */
  .tip.tipbad{background:rgba(255,154,170,.09);border-color:rgba(255,154,170,.42);color:#ffd7dd}
  .tip.tipbad .th{color:#ff9aaa}
  .tip.tipbad .tiprow a{background:rgba(255,154,170,.18);border-color:rgba(255,154,170,.55);color:#ffc7cf}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>📱 천억 캘린더 <span style="font-size:11.5px;font-weight:500;color:var(--dim)">모바일</span></h1>
    <div class="stamp" id="stamp">불러오는 중…</div>
    <div class="warn"><b>★매수신호 아님</b> — 전부 전날 종가까지만 보고 고른 <b>후보 목록</b>이다. 전체(4년)·상세 분석은 PC 캘린더에서 본다.<br><span style="color:#8fd6a8">종목 줄을 누르면 <b>📐 절대값 차트</b>가 뜨고, 오른쪽 <b>네이버 ›</b> 를 누르면 네이버 증권이 새 탭으로 열린다.</span></div>
    <div class="row" id="dates"></div>
    <div class="row" id="cals"></div>
  </header>
  <div id="tip"></div>
  <div id="view"></div>
  <div class="foot" id="foot"></div>
</div>
<div id="absm" class="absm" hidden onclick="if(event.target===this)closeAbs()">
  <div class="abs-sheet">
    <div class="abs-head"><span id="abs-title"></span><span class="abs-x" onclick="closeAbs()">×</span></div>
    <div id="abs-body"></div>
  </div>
</div>
<script src="m_data.js?v=1"></script>
<script>
(function(){
  // ★종목을 누르면 갈 곳. 안 열리면 이 한 줄만 바꾸면 된다.
  //   NAVER_M = 네이버 모바일 증권(폰 화면에 맞음)
  //   NAVER_PC = PC 캘린더가 쓰는 검증된 주소(폰에서는 PC 화면으로 보일 수 있다)
  //   ★둘 중 뭐가 폰에서 잘 열리는지 클로드가 확인하지 못했다(미리보기 창은 외부 사이트를 못 연다).
  //   그래서 ★화면 아래 전환 버튼을 두어 사용자이 직접 고를 수 있게 했다. 고른 값은 폰에 저장된다.
  var LINKS = {
    m:  {t:'네이버 모바일', f:function(c){ return 'https://m.stock.naver.com/domestic/stock/' + c + '/total'; }},
    pc: {t:'네이버 PC판',   f:function(c){ return 'https://finance.naver.com/item/main.naver?code=' + c; }},
    news:{t:'네이버 뉴스',  f:function(c){ return 'https://finance.naver.com/item/news.naver?code=' + c; }}
  };
  var LK = 'm';
  try { LK = localStorage.getItem('ft5_link') || 'm'; } catch(e){}
  if (!LINKS[LK]) LK = 'm';
  function LINK(c){ return LINKS[LK].f(c); }

  var M = window.M;
  // ★어디서 열렸나 = https(공개 주소 GitHub Pages)면 PC 가 꺼져도 열린다 · http(IP·.local = PC 서버)는 PC 가 켜져 있어야 · 한 파일판(file)은 고정 사본
  //   안내 문구가 이걸 가려 말한다(2026-09-21 사용자 "안내 문구도 고쳐줘" = 공개 주소에 "PC 가 켜져 있어야 열린다"가 뜨던 것)
  var PUB = location.protocol === 'https:';
  var view = document.getElementById('view');
  if (!M){ view.innerHTML = '<div class="card"><div class="empty">★m_data.js 를 못 읽었다. PC 에서 <code>python _모바일_빌드.py 30</code> 을 다시 돌려라.</div></div>'; return; }

  // ★언제 만든 자료인지 항상 크게 — 오래된 걸 최신으로 착각하는 게 가장 위험하다
  var made = new Date(M.생성.replace(/-/g,'/'));
  var hrs = Math.floor((Date.now() - made.getTime())/3600000);
  var age = hrs < 1 ? '방금' : (hrs < 24 ? hrs+'시간 전' : Math.floor(hrs/24)+'일 전');
  var stale = hrs >= 24;
  document.getElementById('stamp').innerHTML =
    '자료 만든 때 <b>'+M.생성+'</b> ('+age+')' + (stale ? ' <span style="color:#ff9aaa">★오래됐다 — PC 에서 다시 빌드해라</span>' : '') +
    ' · 최근 '+M.일수+'일 ('+M.범위[0]+' ~ '+M.범위[1]+')';

  // 날짜 목록 = 어느 달력이든 픽이 있는 날
  var dset = {};
  M.달력.forEach(function(c){ Object.keys(c.days).forEach(function(d){ dset[d] = (dset[d]||0) + c.days[d].p.length; }); });
  var dates = Object.keys(dset).sort().reverse();
  var curD = dates[0], curC = M.달력[0].k;
  // ★2026-09-22 달력 7개(PC 순서 · 🗺테마맵·🗂카드맵은 날짜 없는 고정 목록 st) = 처음엔 ★최근 날짜에 자료 있는 첫 날짜 달력을 연다
  (function(){ for (var i = 0; i < M.달력.length; i++){ var x = M.달력[i]; if (!x.st && x.days[curD]){ curC = x.k; return; } } })();

  function chips(el, items, cur, on){
    el.innerHTML = '';
    items.forEach(function(it){
      var b = document.createElement('div');
      b.className = 'chip' + (it.k === cur ? ' on' : '');
      b.innerHTML = it.label + (it.n ? '<span class="n">'+it.n+'</span>' : '');
      b.onclick = function(){ on(it.k); };
      el.appendChild(b);
    });
  }

  // 🤖 BoB3 묶음(rec.b · 지금은 🌇 종가만) = 목록 위에 먼저 · 통과 목록만 종목 줄(누르면 차트 · 네이버 유지) · 불통은 한 줄
  //   PC 칸과 같은 규칙(_캘린더_종가블록.js) · 이름 색 = 노랑 +5% 먼저 / 분홍 −3% 먼저 / 파랑 결과 전 (2026-09-21 사용자 "폰에도 BoB3 3종목")
  function b3html(rec){
    if (!rec || !rec.b || !rec.b.length) return '';
    var COL = {w:'#ffd33a', l:'#ff9d9d'};
    var h = '';
    rec.b.forEach(function(g){
      if (!g.ok){ h += '<div class="grp" style="color:var(--dim2)">' + esc(g.l) + ' 불통 <span style="font-weight:400">= 검증 기준 못 넘어 칸 비움</span></div>'; return; }
      h += '<div class="grp" style="color:#7ee8ff">' + esc(g.l) + ' <span style="font-weight:400;color:var(--dim)">' + esc(g.d || '') + ' · 검증 통과 · 매수신호 아님</span></div>';
      (g.p || []).forEach(function(p){
        var hasC = /^[0-9A-Za-z]{6}$/.test(String(p.c || ''));
        ROWS.push(p);
        h += '<div class="it" data-i="' + (ROWS.length - 1) + '">'
           + '<div class="nm"><b style="color:' + (COL[p.r] || '#7ee8ff') + '">' + esc(p.n) + '</b> <span style="color:var(--dim2);font-size:11.5px">' + (p.c || '') + '</span>'
           + (p.t ? '<div class="sub">' + esc(p.t) + (p.r === 'w' ? ' · +5% 먼저' : (p.r === 'l' ? ' · −3% 먼저' : '')) + '</div>' : '')
           + (p.A ? _abs(p.A) : '')
           + '</div>'
           + (hasC ? '<a class="go" href="' + LINK(p.c) + '" target="_blank" rel="noopener noreferrer">네이버 ›</a>' : '')
           + '</div>';
      });
    });
    return h ? h + '<div class="grp">기계 종목(겹침 많은 순)</div>' : '';
  }

  function draw(){
    chips(document.getElementById('dates'), dates.map(function(d){
      return {k:d, label:d.slice(5).replace('-','/'), n:dset[d]};
    }), curD, function(k){ curD = k; draw(); });

    chips(document.getElementById('cals'), M.달력.map(function(c){
      var r = c.st || c.days[curD];
      return {k:c.k, label:c.t, n:r ? r.p.length : 0};
    }), curC, function(k){ curC = k; draw(); });

    var c = M.달력.filter(function(x){ return x.k === curC; })[0];
    var rec = c.st || c.days[curD];                // st = 날짜 없는 고정 목록(테마맵·카드맵)
    var h = '<div class="card"><div class="chead"><div class="t">'+c.t+'</div><div class="d">'+c.d+'</div></div>';
    if (!rec || !rec.p.length){
      h += '<div class="empty">이 날은 이 달력에 종목이 없다. <b>0건이 정상</b>이다 — 억지로 채우지 않는다.</div></div>';
      view.innerHTML = h; foot(c, rec); return;
    }
    h += c.st ? '<div class="cnt">기준 <b>'+esc(c.st.기준||'-')+'</b> · 날짜와 무관(PC 와 같은 고정 자료) · <b>'+rec.p.length+'</b>줄</div>'
         : (c.k === 'month' || c.k === 'clean') ? '<div class="cnt">그날 <b>'+curD+'</b> · <b>'+rec.p.length+'</b>종목</div>'
         : '<div class="cnt">매수일 <b>'+curD+'</b> · 신호일 '+(rec.s||'-')+' · <b>'+rec.p.length+'</b>종목</div>';
    h += b3html(rec);                              // 🤖 BoB3 (있는 달력·날만)
    var lastG = null;
    rec.p.forEach(function(p){
      if (p.g && p.g !== lastG){ h += '<div class="grp">'+p.g+'</div>'; lastG = p.g; }
      var LB = {당일:['#8fd6a8','당일'],최근:['#ffc454','최근'],오래:['#8487bd','오래'],
                이력:['#9fc8ff','이력'],성격:['#c9a0ff','성격']}[p.L];
      // ★종목 코드가 있을 때만 링크를 건다(없으면 깨진 주소로 간다)
      // ★숫자 6자리만 받으면 최근 상장 종목(영문 섞인 코드 = 0015N0 등)이 링크에서 빠진다
      var hasC = /^[0-9A-Za-z]{6}$/.test(String(p.c||''));
      // ★줄 본문 = 📐 절대값 차트 시트 · 오른쪽 `네이버 ›` = 네이버 새 탭 (둘 다 유지 · 2026-09-21 사용자)
      ROWS.push(p);
      var open = '<div class="it" data-i="' + (ROWS.length - 1) + '">';
      h += open
         + (LB ? '<span class="lab" style="color:'+LB[0]+';border-color:'+LB[0]+'">'+LB[1]+'</span>' : '')
         + '<div class="nm"><b>'+esc(p.n)+'</b> <span style="color:var(--dim2);font-size:11.5px">'+(p.c||'')+'</span>'
         + (p.t ? '<div class="sub">'+esc(p.t)+'</div>' : '')
         + (p.m ? '<div class="mat">'+esc(p.m)+'</div>' : '')
         + (p.A ? _abs(p.A) : '')
         + '</div>'
         + (hasC ? '<a class="go" href="'+LINK(p.c)+'" target="_blank" rel="noopener noreferrer">네이버 ›</a>' : '')
         + '</div>';
    });
    view.innerHTML = h + '</div>';
    // 줄 클릭 → 차트 시트. 네이버 배지 클릭은 시트로 번지지 않게 막는다.
    [].forEach.call(view.querySelectorAll('.it[data-i]'), function(el){
      el.onclick = function(ev){ if(ev.target.closest && ev.target.closest('.go')) return; openAbs(ROWS[+el.getAttribute('data-i')]); };
    });
    [].forEach.call(view.querySelectorAll('.go'), function(el){ el.onclick = function(ev){ ev.stopPropagation(); }; });
    foot(c, rec);
  }

  function foot(c, rec){
    var sw = Object.keys(LINKS).map(function(k){
      return '<span class="lk' + (k===LK ? ' on' : '') + '" data-lk="' + k + '">' + LINKS[k].t + '</span>';
    }).join('');
    var tOff = false; try { tOff = localStorage.getItem('ft5_tip') === 'off'; } catch(e){}
    var again = tOff ? '<br><span class="tipagain" id="tipagain">📲 홈 화면 아이콘 만드는 법 다시 보기</span>' : '';
    document.getElementById('foot').innerHTML =
      '<div class="lkbox"><b style="color:#dce0f5">네이버 › 를 누르면 갈 곳</b> — 안 열리면 다른 걸 골라보세요<div class="lkrow">' + sw + '</div></div>'
      + (PUB ? '자료 = 천프정 일봉 · 아침 <b>/장전뉴스</b>·<b>/각이평선눌림</b>, 저녁 <b>/매매일</b> 이 끝날 때 PC 가 이 공개 주소에 새 판을 올린다(PC 를 꺼도 이 화면은 열린다).<br>'
             : '자료 = 천프정 일봉 · PC 에서 <code>python _모바일_빌드.py 30</code> 을 돌리면 이 화면이 갱신된다.<br>')
      + '★여기 있는 건 전부 <b>후보 목록</b>이다. 성적·빈틈·28년 전수는 PC 캘린더와 스킬 문서에 있다.'
      + (M.건너뜀 && M.건너뜀.length ? '<br>★건너뛴 달력 = ' + M.건너뜀.join(' / ') : '')
      + again;
    [].forEach.call(document.querySelectorAll('.lk'), function(el){
      el.onclick = function(){
        LK = el.getAttribute('data-lk');
        try { localStorage.setItem('ft5_link', LK); } catch(e){}
        draw();                                   // ★다시 그려야 링크가 바뀐다
      };
    });
    var ta = document.getElementById('tipagain');
    if (ta) ta.onclick = function(){
      try { localStorage.removeItem('ft5_tip'); } catch(e){}
      installTip(); foot(); window.scrollTo(0, 0);
    };
  }
  function esc(s){ return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

  // 📐 절대값 = 빌더(_모바일_빌드.py)가 ★_F명세.py 로 미리 계산해 넣은 값이다.
  //   폰에는 봉 자료를 못 넣어서(전 종목 41MB · 한 파일판은 PC 없이 열려야 한다) 차트 대신 숫자만 온다.
  //   규칙을 여기서 다시 만들지 않으므로 PC 캘린더와 값이 어긋나지 않는다.
  //   A = [뼈대, 아래값, 아래색, 위값, 위색, 아래%, 위%, 뼈대대비배수]
  var ABSC = {R:'#ff4444', G:'#33dd66', W:'#dddddd', B:'#4488ee'};
  var ROWS = [];                                   // 화면에 그린 픽 객체 = 시트가 그대로 받는다

  // ════ 📐 절대값 차트 시트 (2026-09-21 · PC 캘린더 _절대값차트_그리기 를 옮김) ════
  //   격자 = M.격자 (빌더가 _F명세.py LINES 를 실어 보냄) — 폰은 규칙을 모른 채 선만 그린다.
  //   봉 = 봉/<code>.js 를 누를 때만 <script> 로 받는다(공개 주소에서만 있다 · 한 파일판/오프라인 미보유면 칩만).
  var ABS_R = {}, ABS_CUR = null;
  function absGrid(lo, hi){
    var out = [];
    (M.격자 || []).forEach(function(g){ if(g[0] >= lo && g[0] <= hi) out.push({v:g[0], t:g[1], c:ABSC[g[1]] || '#8487bd'}); });
    return out;
  }
  function openAbs(p){
    ABS_CUR = p;
    var m = document.getElementById('absm'); m.hidden = false; document.body.style.overflow = 'hidden';
    document.getElementById('abs-title').innerHTML = '<b>' + esc(p.n) + '</b> <span class="cd">' + esc(p.c || '') + (p.g ? ' · ' + esc(p.g) : '') + '</span>';
    var body = document.getElementById('abs-body');
    body.innerHTML = '<div class="abs-note">📐 봉 자료 불러오는 중…</div>';
    var code = String(p.c || '');
    if(!/^[0-9A-Za-z]{6}$/.test(code)){ absFallback(p, '종목코드가 없어 차트를 못 그린다'); return; }
    var D = window['__B_' + code];
    if(D && D.c && D.c.length){ drawAbs(D, p); return; }
    var s = document.createElement('script');
    s.src = '봉/' + code + '.js';
    s.onload = function(){ var E = window['__B_' + code]; if(E && E.c && E.c.length) drawAbs(E, p); else absFallback(p, '봉 자료 형식이 다르다'); };
    s.onerror = function(){ absFallback(p, '이 화면엔 봉 자료가 없다(PC 없이 보는 사본이거나 아직 안 받은 종목)'); };
    document.head.appendChild(s);
  }
  function closeAbs(){ document.getElementById('absm').hidden = true; document.body.style.overflow = ''; ABS_CUR = null; }
  // ★시트의 onclick="closeAbs()" 는 전역을 찾는다 — IIFE 안에만 두면 × 가 안 눌린다(2026-09-21 실측 ReferenceError)
  window.closeAbs = closeAbs; window.openAbs = openAbs;
  function absChips(px, dstr, below, above, bone){
    var n = function(x){ return (+x).toLocaleString('ko-KR'); };
    var chip = function(l, v, c, sub){ return '<div class="abs-chip"><div class="l">' + l + '</div><div class="v" style="color:' + c + '">' + v + (sub ? ' <i>' + sub + '</i>' : '') + '</div></div>'; };
    return '<div style="display:flex;gap:4px;margin-top:6px;flex-wrap:wrap">'
      + chip('종가', n(px), '#dce8ff', dstr)
      + (bone ? chip('뼈대', n(bone.v), '#ff4444', '×' + (px / bone.v).toFixed(3)) : '')
      + (below ? chip('바로 아래 선', n(below.v), below.c, '−' + ((px / below.v - 1) * 100).toFixed(2) + '%') : '')
      + (above ? chip('바로 위 선', n(above.v), above.c, '+' + ((above.v / px - 1) * 100).toFixed(2) + '%') : '')
      + '</div>';
  }
  function absFallback(p, why){
    var body = document.getElementById('abs-body'), A = p.A, h = '<div class="abs-note">📐 ' + esc(why) + '.</div>';
    if(A){
      var below = {v:A[1], c:ABSC[A[2]]}, above = {v:A[3], c:ABSC[A[4]]}, bone = {v:A[0]};
      h += absChips(Math.round(A[0] * A[7]), '신호일 종가 기준', below, above, bone);
    }
    h += '<a class="abs-nv" href="' + (p.c ? LINK(p.c) : '#') + '" target="_blank" rel="noopener noreferrer">📊 네이버에서 보기 ›</a>';
    body.innerHTML = h;
  }
  function drawAbs(D, p){
    var body = document.getElementById('abs-body'), code = String(p.c || '');
    try{
      var N = D.c.length, R = Math.min(ABS_R[code] || 250, N), i0 = N - R, i;
      var lo = Infinity, hi = -Infinity, vmax = 0;
      for(i = i0; i < N; i++){ if(D.l[i] < lo) lo = D.l[i]; if(D.h[i] > hi) hi = D.h[i]; if(D.v[i] > vmax) vmax = D.v[i]; }
      if(!(lo > 0) || !(hi > 0)){ absFallback(p, '가격이 0 이라 그릴 수 없다'); return; }
      lo /= 1.05; hi *= 1.05;
      var W = 560, PL = 6, PR = 66, PT = 10, HP = 202, HV = 32, H = PT + HP + 8 + HV + 14;
      var A = Math.log(lo), B2 = Math.log(hi);                 // 로그축 = 뼈대가 ×2 라 칸 높이가 균등
      var Y = function(v){ return PT + (B2 - Math.log(v)) / (B2 - A) * HP; };
      var bw = (W - PL - PR) / R, cw = Math.max(1, Math.min(7, bw * 0.66));
      var X = function(j){ return PL + (j - i0) * bw + bw / 2; };
      var g = '<svg viewBox="0 0 ' + W + ' ' + H + '" style="width:100%;height:auto;display:block;background:#05050c;border-radius:7px">';
      var STY = {R:[1.5,'',0.95,10.5,700], G:[1.3,'8 4',0.85,10.5,700], W:[1.0,'6 3 2 3',0.5,9,400], B:[0.7,'2 4',0.38,8.5,400]};
      absGrid(lo, hi).forEach(function(G){
        var y = Y(G.v), s = STY[G.t] || [0.8,'2 4',0.35,8.5,400];
        g += '<line x1="' + PL + '" y1="' + y.toFixed(1) + '" x2="' + (W - PR) + '" y2="' + y.toFixed(1) + '" stroke="' + G.c + '" stroke-width="' + s[0] + '" stroke-dasharray="' + s[1] + '" opacity="' + s[2] + '"/>';
        g += '<text x="' + (W - PR + 5) + '" y="' + (y + 3.2).toFixed(1) + '" fill="' + G.c + '" opacity="' + Math.min(1, s[2] + 0.25) + '" font-size="' + s[3] + '" font-weight="' + s[4] + '">' + G.v.toLocaleString() + '</text>';
      });
      for(i = i0; i < N; i++){
        var col = (D.c[i] >= D.o[i]) ? '#e23a4e' : '#3d82d6', x = X(i);
        g += '<line x1="' + x.toFixed(1) + '" y1="' + Y(D.h[i]).toFixed(1) + '" x2="' + x.toFixed(1) + '" y2="' + Y(D.l[i]).toFixed(1) + '" stroke="' + col + '" stroke-width="1"/>';
        var a = Y(D.o[i]), b = Y(D.c[i]);
        g += '<rect x="' + (x - cw / 2).toFixed(1) + '" y="' + Math.min(a, b).toFixed(1) + '" width="' + cw.toFixed(1) + '" height="' + Math.max(1, Math.abs(a - b)).toFixed(1) + '" fill="' + col + '"/>';
        var vh = vmax ? D.v[i] / vmax * HV : 0;
        g += '<rect x="' + (x - cw / 2).toFixed(1) + '" y="' + (PT + HP + 8 + HV - vh).toFixed(1) + '" width="' + cw.toFixed(1) + '" height="' + vh.toFixed(1) + '" fill="' + col + '" opacity=".4"/>';
      }
      for(var k = 0; k < 4; k++){
        var i3 = i0 + Math.round((R - 1) * k / 3), dd = String(D.d[i3]);
        g += '<text x="' + X(i3).toFixed(1) + '" y="' + (H - 3) + '" fill="#6b7482" font-size="9" text-anchor="middle">' + dd.slice(0, 2) + '.' + dd.slice(2, 4) + '</text>';
      }
      g += '</svg>';
      var px = D.c[N - 1], below = null, above = null, bone = null;
      absGrid(px / 2.3, px * 2.3).forEach(function(G){
        if(G.v <= px){ if(!below || G.v > below.v) below = G; if(G.t === 'R' && (!bone || G.v > bone.v)) bone = G; }
        else if(!above || G.v < above.v) above = G;
      });
      var rb = [[60,'3개월'],[250,'1년'],[500,'2년']].map(function(q){ return '<span class="abs-r' + (R === Math.min(q[0], N) ? ' on' : '') + '" data-r="' + q[0] + '">' + q[1] + '</span>'; }).join('');
      body.innerHTML = '<div style="display:flex;align-items:center;margin-bottom:6px"><span style="font-size:10.5px;color:#6b7482">천프정 일봉(원본주가) · ' + N + '봉</span><span style="margin-left:auto">' + rb + '</span></div>'
        + g + absChips(px, String(D.d[N-1]).replace(/^(\d\d)(\d\d)(\d\d)$/, '$1.$2.$3'), below, above, bone)
        + '<div class="abs-note"><span style="color:#ff4444">━ 뼈대(781.25×2ⁿ)</span> · <span style="color:#33dd66">┅ ×1.5</span> · <span style="color:#dddddd">┅ ×1.25·1.75</span> · <span style="color:#4488ee">┅ 8등분</span> · 로그축<br>★격자는 눈금이다(지지·저항 효과가 검증된 것이 아니다) · 원본주가라 권리락·액면병합이 있으면 과거 구간이 점프한다</div>'
        + '<a class="abs-nv" href="' + LINK(code) + '" target="_blank" rel="noopener noreferrer">📊 네이버에서 보기 ›</a>';
      [].forEach.call(body.querySelectorAll('.abs-r'), function(el){ el.onclick = function(){ ABS_R[code] = +el.getAttribute('data-r'); drawAbs(D, p); }; });
    }catch(e){ absFallback(p, '그리다가 막혔다 (' + (e && e.message ? e.message : e) + ')'); }
  }
  function _abs(A){
    var n = function(x){ return (+x).toLocaleString('ko-KR'); };
    return '<div class="abs">📐 뼈대 <b style="color:#ff4444">' + n(A[0]) + '</b> ×' + A[7]
         + ' · <span style="color:' + (ABSC[A[2]] || '#8487bd') + '">↓' + n(A[1]) + '</span> <i>−' + A[5] + '%</i>'
         + ' · <span style="color:' + (ABSC[A[4]] || '#8487bd') + '">↑' + n(A[3]) + '</span> <i>+' + A[6] + '%</i></div>';
  }

  // ★홈 화면 아이콘 만드는 법 — 이미 아이콘으로 열었으면(standalone) 저절로 안 뜬다
  function installTip(){
    var box = document.getElementById('tip');
    var app = (window.matchMedia && matchMedia('(display-mode: standalone)').matches)
              || window.navigator.standalone === true;
    var off = false; try { off = localStorage.getItem('ft5_tip') === 'off'; } catch(e){}
    if (app || off){ box.innerHTML = ''; return; }

    var ua   = navigator.userAgent || '';
    var ios  = /iPad|iPhone|iPod/.test(ua)
               || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);

    // ★★카카오톡·네이버 같은 '앱 안에 들어있는 브라우저'에는 홈 화면 추가 기능이 ★아예 없다.
    //   2026-09-20 사용자이 카카오톡 브라우저로 열어서 여기서 막혔다. 그러면 다른 말은 다 소용없다.
    if (/KAKAOTALK|NAVER\(inapp|FBAN|FBAV|FB_IAB|Instagram|Line\/|DaumApps|BAND|everytimeApp|Snapchat/i.test(ua)){
      var here = location.host + location.pathname + location.search;
      var toChrome = 'intent://' + here + '#Intent;scheme=http;package=com.android.chrome;end';
      box.innerHTML =
        '<div class="tip tipbad"><div class="th">⚠ 지금 이 브라우저로는 아이콘을 못 만든다</div>'
        + '<b>카카오톡·네이버 같은 앱 안의 브라우저</b>에는 <b>홈 화면에 추가</b> 기능이 아예 없다. 브라우저부터 바꿔야 한다.'
        + '<ol><li>' + (ios ? '오른쪽 아래 <b>⋯</b> → <b>Safari로 열기</b>'
                            : '오른쪽 아래 <b>⋮</b> → <b>다른 브라우저로 열기</b>(또는 Chrome)') + '</li>'
        + '<li>크롬(사파리)에서 이 화면이 다시 뜨면 그때 아이콘을 만든다.</li></ol>'
        + (ios ? '' : '<div class="tiprow"><a href="' + toChrome + '">★크롬으로 바로 열기</a></div>')
        + '</div>';
      return;
    }

    var how  = ios ? '맨 아래 <b>공유</b>(네모에 화살표 ↑) → <b>홈 화면에 추가</b>'
                   : '오른쪽 위 <b>⋮</b> → <b>홈 화면에 추가</b>';
    var look = ios ? '아이폰은 주소창 없이 앱처럼 뜬다.'
                   : (PUB ? '안드로이드도 아이콘으로 열면 주소창 없이 앱처럼 뜬다(https 주소).'
                          : '안드로이드는 주소창이 보일 수 있다(지금 주소가 http 라서). 아이콘으로 여는 건 똑같다.');

    // ★순서 주의 — '지금 바로 추가'가 1번이다. 고정 이름 주소는 ★되는 폰에서만 아래에 덧붙는다.
    //   (2026-09-20 = 내가 고정주소를 1번에 놔서, 그게 안 열리는 폰에서 아이콘 만들기 자체가 막혔다)
    box.innerHTML =
      '<div class="tip"><div class="th">📲 주소 치지 말고 — 홈 화면에 아이콘 만들기</div>'
      + '<ol><li>' + how + '</li>'
      + '<li>이름은 <b>천억</b> 그대로 두고 추가한다.</li></ol>'
      + '그 다음부터는 <b>아이콘만 누르면</b> 열린다. ' + look
      + (PUB ? '<br><span style="color:#8fd6a8">PC 가 꺼져 있어도 열린다</span> — 인터넷의 공개 주소에서 받는다. 새 자료는 PC 에서 스킬이 올릴 때만 바뀐다(맨 위 <b>자료 만든 때</b>로 확인).'
             : '<br><span style="color:#ff9aaa">⚠ 단, PC 와 검은 서버 창이 켜져 있어야 열린다</span> — 꺼져 있으면 빈 화면이 뜬다.')
      // ★위 목록으로 못 잡는 앱 브라우저가 또 있을 수 있다. 그때를 위한 안전망 한 줄.
      + '<br><span style="color:var(--dim2)">※ 메뉴에 <b>홈 화면에 추가</b>가 안 보이면 그 브라우저엔 그 기능이 없는 것이다 — <b>크롬</b>으로 열면 된다.</span>'
      + '<div id="tipfix"></div>'
      + '<div class="tiprow"><span id="tipoff">안 볼래요</span></div></div>';

    var o = document.getElementById('tipoff');
    if (o) o.onclick = function(){
      try { localStorage.setItem('ft5_tip', 'off'); } catch(e){}
      box.innerHTML = '';
      foot();                       // ★'다시 보기' 줄이 생기도록 아래쪽을 다시 그린다
    };

    // 서버(_모바일_서버.py)가 __HOST__/__PORT__ 를 이 PC 이름으로 바꿔 보낸다. 안 바뀌었으면 시험도 안 한다.
    var fixed = 'http://__HOST__:__PORT__/';
    if (fixed.indexOf('.local') > 0 && /^\d{1,3}(\.\d{1,3}){3}$/.test(location.hostname)) probeFixed(fixed);
  }

  // ★그 이름 주소가 ★이 폰에서 진짜 열리는지 그림 한 장으로 미리 시험한다.
  //   되는 폰에서만 버튼을 보여준다 — 안 되는 폰에 버튼을 띄우면 눌러도 '페이지를 찾을 수 없음'만 나온다.
  function probeFixed(base){
    var done = false, t, im = new Image();
    function fin(ok){
      if (done) return;
      done = true; clearTimeout(t);
      var slot = document.getElementById('tipfix');
      if (!slot || !ok) return;                    // 안 되면 ★아무 말도 안 한다(헛클릭 방지)
      slot.innerHTML = '<div style="margin-top:9px;padding-top:9px;border-top:1px dashed var(--line)">'
        + '★이 폰은 <b>이름 주소</b>도 열린다. 그걸로 만들면 <b>와이파이가 바뀌어도 아이콘이 안 깨진다</b>(안 해도 된다).'
        + '<div class="tiprow"><a href="' + base + '">이름 주소로 열기</a></div></div>';
    }
    im.onload  = function(){ fin(true); };
    im.onerror = function(){ fin(false); };
    t = setTimeout(function(){ fin(false); }, 3500);
    im.src = base + 'icon-180.png?p=' + (+new Date());
  }

  draw();
  installTip();
  // ★http 주소(IP)로 열면 브라우저가 서비스워커를 아예 안 준다(비보안). 그래서 오프라인 저장은 안 된다.
  //   https 로 열 때만 등록된다 — 없다고 해서 화면이 깨지지는 않는다.
  if ('serviceWorker' in navigator){ navigator.serviceWorker.register('sw.js').catch(function(){}); }
})();
</script>
